<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLeaks</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
    }

    header {
      background: #1877f2;
      color: white;
      padding: 15px 20px;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 15px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #0001;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      background: #1877f2;
      color: white;
      border: 0;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      margin: 5px 3px 5px 0;
      font-weight: bold;
    }

    button:hover {
      background: #0d65d9;
    }

    .logout {
      background: #555;
    }

    .post {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px #0001;
    }

    .post-date {
      color: #777;
      font-size: 12px;
      margin-bottom: 10px;
    }

    #status {
      margin: 10px 0;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    h2 {
      margin-top: 0;
    }
  </style>
</head>

<body>

<header>
  MyLeaks
</header>

<div class="container">

  <!-- LOGOWANIE -->
  <div class="box" id="authBox">
    <h2>Logowanie</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Hasło"
    >

    <button onclick="login()">Zaloguj się</button>
    <button onclick="register()">Załóż konto</button>

    <div id="status"></div>
  </div>

  <!-- PANEL UŻYTKOWNIKA -->
  <div class="box hidden" id="userBox">
    <h2>Witaj! 👋</h2>

    <p id="userEmail"></p>

    <button class="logout" onclick="logout()">Wyloguj się</button>
  </div>

  <!-- DODAWANIE POSTA -->
  <div class="box hidden" id="postBox">
    <h2>Dodaj post</h2>

    <textarea
      id="postContent"
      placeholder="Co chcesz napisać?"
    ></textarea>

    <button onclick="addPost()">Opublikuj</button>
  </div>

  <!-- POSTY -->
  <h2>Posty</h2>

  <div id="posts">
    Ładowanie postów...
  </div>

</div>

<script>
  // ==============================
  // SUPABASE
  // ==============================

  const SUPABASE_URL =
    "https://wenzjyhwntdiytgjgpkp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_EYRZ9-Ynliw6rF1R_QQZ6g_KgHl_p_D";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // STATUS
  // ==============================

  function showStatus(message) {
    document.getElementById("status").textContent = message;
  }


  // ==============================
  // REJESTRACJA
  // ==============================

  async function register() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      showStatus("Wpisz email i hasło.");
      return;
    }

    if (password.length < 6) {
      showStatus("Hasło musi mieć minimum 6 znaków.");
      return;
    }

    showStatus("Tworzenie konta...");

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {
      showStatus("Błąd: " + error.message);
      return;
    }

    showStatus(
      "Konto utworzone! Jeśli trzeba, sprawdź email i potwierdź konto."
    );
  }


  // ==============================
  // LOGOWANIE
  // ==============================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      showStatus("Wpisz email i hasło.");
      return;
    }

    showStatus("Logowanie...");

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      showStatus("Błąd logowania: " + error.message);
      return;
    }

    showStatus("Zalogowano!");
    updateUI(data.user);
  }


  // ==============================
  // WYLOGOWANIE
  // ==============================

  async function logout() {

    await supabaseClient.auth.signOut();

    updateUI(null);
  }


  // ==============================
  // INTERFEJS
  // ==============================

  function updateUI(user) {

    const authBox =
      document.getElementById("authBox");

    const userBox =
      document.getElementById("userBox");

    const postBox =
      document.getElementById("postBox");

    const userEmail =
      document.getElementById("userEmail");

    if (user) {

      authBox.classList.add("hidden");
      userBox.classList.remove("hidden");
      postBox.classList.remove("hidden");

      userEmail.textContent =
        "Zalogowany jako: " + user.email;

    } else {

      authBox.classList.remove("hidden");
      userBox.classList.add("hidden");
      postBox.classList.add("hidden");

      userEmail.textContent = "";
    }
  }


  // ==============================
  // DODAWANIE POSTA
  // ==============================

  async function addPost() {

    const content =
      document.getElementById("postContent").value.trim();

    if (!content) {
      alert("Napisz coś przed opublikowaniem.");
      return;
    }

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      alert("Musisz być zalogowany.");
      return;
    }

    const { error } =
      await supabaseClient
        .from("posts")
        .insert({
          content: content
        });

    if (error) {
      alert("Nie udało się dodać posta: " + error.message);
      return;
    }

    document.getElementById("postContent").value = "";

    loadPosts();
  }


  // ==============================
  // POBIERANIE POSTÓW
  // ==============================

  async function loadPosts() {

    const postsElement =
      document.getElementById("posts");

    const {
      data,
      error
    } = await supabaseClient
      .from("posts")
      .select("id, content, created_at")
      .order("created_at", {
        ascending: false
      });

    if (error) {
      postsElement.textContent =
        "Nie udało się załadować postów.";
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      postsElement.textContent =
        "Nie ma jeszcze żadnych postów.";
      return;
    }

    postsElement.innerHTML = "";

    data.forEach(post => {

      const postElement =
        document.createElement("div");

      postElement.className = "post";

      const date =
        new Date(post.created_at)
          .toLocaleString("pl-PL");

      const dateElement =
        document.createElement("div");

      dateElement.className = "post-date";
      dateElement.textContent = date;

      const contentElement =
        document.createElement("div");

      contentElement.textContent =
        post.content;

      postElement.appendChild(dateElement);
      postElement.appendChild(contentElement);

      postsElement.appendChild(postElement);
    });
  }


  // ==============================
  // SPRAWDZENIE SESJI
  // ==============================

  async function checkUser() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    updateUI(user);
  }


  // ==============================
  // START
  // ==============================

  checkUser();
  loadPosts();

</script>
<!-- ZNAJOMI I WIADOMOŚCI -->
<div style="margin-top:30px; padding:20px; background:white; border-radius:10px;">
  <h2>👥 Znajomi</h2>

  <input id="friendEmail" type="email" placeholder="Email użytkownika">
  <button id="addFriendBtn">Dodaj znajomego</button>

  <div id="friendsList" style="margin-top:15px;"></div>

  <hr style="margin:25px 0;">

  <h2>💬 Prywatne wiadomości</h2>

  <div id="messagesList"></div>

  <input id="messageText" type="text" placeholder="Napisz wiadomość...">
  <button id="sendMessageBtn">Wyślij</button>
</div>
</body>
</html>
